# Startet API + GUI mit einem Befehl:  docker compose up   (W7)
# Beide Dienste teilen sich dasselbe Image; .env liefert die API-Keys.
services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Gelernte Daten muessen den Container ueberleben: Profil, Bewertungen,
      # Kochbuch-Rezepte (W3/W13) und gespeicherte Wochenplaene liegen als
      # JSON-Dateien unter data/. Ohne dieses Volume waere nach
      # `docker compose down` genau das weg, was Continual Learning ausmacht.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Zeit fuer den ersten Start (Imports von langchain/langgraph dauern)
      start_period: 20s

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    env_file:
      - .env
    volumes:
      # Dieselbe Ablage wie die API -- die GUI zeigt Kochbuch/Wochenplaene an.
      - ./data:/app/data
    depends_on:
      # Erst starten, wenn die API wirklich antwortet (nicht nur "Container laeuft"),
      # sonst zeigt die GUI beim ersten Aufruf "Backend nicht erreichbar".
      api:
        condition: service_healthy
